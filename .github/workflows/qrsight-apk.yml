name: Build QRSight Release APK

on:
  push:
    branches:
      - 'qr-apk-staging-*'
      - 'chatgpt/qrsight-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-qrsight:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and patch QRSight source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat qrsight_bundle.part-* | base64 --decode > /tmp/qrsight-source.tar.gz
          tar -xzf /tmp/qrsight-source.tar.gz
          test -f qrscanner/app/build.gradle

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('qrscanner')
          main = root / 'app/src/main/java/com/jerry/qrsight/MainActivity.java'
          history = root / 'app/src/main/java/com/jerry/qrsight/HistoryActivity.java'
          build = root / 'app/build.gradle'
          manifest = root / 'app/src/main/AndroidManifest.xml'
          readme = root / 'README.md'

          text = main.read_text(encoding='utf-8')
          text = text.replace('import android.content.ColorStateList;', 'import android.content.res.ColorStateList;')
          if 'import android.annotation.SuppressLint;' not in text:
              text = text.replace('import android.Manifest;\n', 'import android.Manifest;\nimport android.annotation.SuppressLint;\n')
          if '@SuppressLint("UnsafeOptInUsageError")' not in text:
              text = text.replace(
                  '    private void analyzeImage(@NonNull ImageProxy imageProxy) {',
                  '    @SuppressLint("UnsafeOptInUsageError")\n    private void analyzeImage(@NonNull ImageProxy imageProxy) {'
              )
          old_sort = '''        Collections.sort(found, Comparator
                  .comparingDouble((Detection item) -> item.bounds.top)
                  .thenComparingDouble(item -> item.bounds.left));'''
          new_sort = '''        Collections.sort(found, (first, second) -> {
              int topOrder = Float.compare(first.bounds.top, second.bounds.top);
              return topOrder != 0 ? topOrder : Float.compare(first.bounds.left, second.bounds.left);
          });'''
          if old_sort not in text:
              raise SystemExit('Expected legacy comparator block was not found')
          text = text.replace(old_sort, new_sort)
          text = text.replace('import java.util.Comparator;\n', '')
          main.write_text(text, encoding='utf-8')

          h = history.read_text(encoding='utf-8')
          h = h.replace('import android.content.ColorStateList;\n', '')
          h = h.replace('import android.content.res.ColorStateList;\n', '')
          history.write_text(h, encoding='utf-8')

          g = build.read_text(encoding='utf-8')
          replacements = {
              'targetSdk 35': 'targetSdk 36',
              "androidx.appcompat:appcompat:1.7.0": "androidx.appcompat:appcompat:1.7.1",
              "androidx.core:core:1.15.0": "androidx.core:core:1.19.0",
              "androidx.activity:activity:1.10.1": "androidx.activity:activity:1.13.0",
              "com.google.android.material:material:1.12.0": "com.google.android.material:material:1.14.0",
          }
          for old, new in replacements.items():
              if old not in g:
                  raise SystemExit(f'Expected Gradle token missing: {old}')
              g = g.replace(old, new)
          build.write_text(g, encoding='utf-8')

          m = manifest.read_text(encoding='utf-8')
          m = re.sub(r'\n\s*android:screenOrientation="portrait"', '', m)
          manifest.write_text(m, encoding='utf-8')

          if readme.exists():
              r = readme.read_text(encoding='utf-8').replace('targetSdk: 35', 'targetSdk: 36')
              readme.write_text(r, encoding='utf-8')
          PY

          ! grep -R --line-number 'import android.content.ColorStateList;' qrscanner/app/src/main/java
          ! grep -R --line-number 'Comparator.comparingDouble' qrscanner/app/src/main/java
          grep -q '@SuppressLint("UnsafeOptInUsageError")' qrscanner/app/src/main/java/com/jerry/qrsight/MainActivity.java
          grep -q 'targetSdk 36' qrscanner/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate isolated release signing key
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          KEYSTORE="$RUNNER_TEMP/qrsight-release.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias qrsight \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname 'CN=QRSight Release,O=Jerry Wang,C=TW'
          echo "keystore=$KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "password=$PASS" >> "$GITHUB_OUTPUT"

      - name: Unit tests, lint, and signed release build
        id: gradle_build
        continue-on-error: true
        working-directory: qrscanner
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p ../dist
          gradle --no-daemon --stacktrace --console=plain \
            testReleaseUnitTest lintRelease assembleRelease \
            -PQRSIGHT_STORE_FILE='${{ steps.signing.outputs.keystore }}' \
            -PQRSIGHT_STORE_PASSWORD='${{ steps.signing.outputs.password }}' \
            -PQRSIGHT_KEY_ALIAS='qrsight' \
            -PQRSIGHT_KEY_PASSWORD='${{ steps.signing.outputs.password }}' \
            2>&1 | tee ../dist/gradle-build.log
          code=${PIPESTATUS[0]}
          echo "$code" > ../dist/gradle-exit-code.txt
          exit "$code"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qrsight-diagnostics-${{ github.run_id }}
          path: |
            dist/gradle-build.log
            dist/gradle-exit-code.txt
            qrscanner/app/build/reports/lint-results-release.html
            qrscanner/app/build/reports/lint-results-release.txt
            qrscanner/app/build/reports/tests/testReleaseUnitTest
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after failed Gradle validation
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Verify package, permissions, alignment, signature, and ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          APK='qrscanner/app/build/outputs/apk/release/app-release.apk'
          OUT='dist/QRSight-v1.0.0-release.apk'
          cp "$APK" "$OUT"
          BT="$ANDROID_HOME/build-tools/36.0.0"

          "$BT/zipalign" -c -v 4 "$OUT" > dist/zipalign.txt
          "$BT/apksigner" verify --verbose --print-certs "$OUT" > dist/signature.txt
          unzip -t "$OUT" > dist/unzip-test.txt
          "$BT/aapt" dump badging "$OUT" > dist/badging.txt
          "$BT/aapt" dump permissions "$OUT" > dist/permissions.txt

          grep -q "package: name='com.jerry.qrsight'" dist/badging.txt
          grep -q "targetSdkVersion:'36'" dist/badging.txt
          grep -q 'android.permission.CAMERA' dist/permissions.txt

          if grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES)' dist/permissions.txt; then
            echo 'Unexpected network or storage permission detected.' >&2
            cat dist/permissions.txt >&2
            exit 1
          fi

          sha256sum "$OUT" > dist/SHA256SUMS.txt
          {
            echo 'QRSight 快掃 v1.0.0'
            echo 'Build type: signed release APK'
            echo 'Package: com.jerry.qrsight'
            echo 'minSdk: 23'
            echo 'targetSdk: 36'
            echo 'compileSdk: 36'
            echo
            echo '=== APK SHA-256 ==='
            cat dist/SHA256SUMS.txt
            echo
            echo '=== Badging ==='
            cat dist/badging.txt
            echo
            echo '=== Permissions ==='
            cat dist/permissions.txt
            echo
            echo '=== Signature ==='
            cat dist/signature.txt
            echo
            echo '=== Zipalign ==='
            cat dist/zipalign.txt
            echo
            echo 'Build-level validation completed in GitHub Actions.'
            echo 'Physical-device camera behavior requires installation on an Android phone.'
          } > dist/QRSight-build-report.txt

      - name: Package source code
        run: |
          zip -r dist/QRSight-v1.0.0-source.zip qrscanner \
            -x '*/.gradle/*' '*/build/*' '*.jks' '*.keystore'

      - name: Upload install package and verification report
        uses: actions/upload-artifact@v4
        with:
          name: qrsight-apk
          path: |
            dist/QRSight-v1.0.0-release.apk
            dist/QRSight-v1.0.0-source.zip
            dist/QRSight-build-report.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14