name: Temporary SNAC asset test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Create test file
        run: |
          mkdir -p out
          printf 'ok\n' > out/test.txt
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-artifact
          path: out
          retention-days: 1
