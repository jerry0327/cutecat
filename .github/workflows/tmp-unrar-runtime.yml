name: Temporary unrar runtime fetch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official RAR for Linux
        run: |
          set -euxo pipefail
          mkdir -p out
          curl -fL --retry 8 --retry-all-errors \
            -o /tmp/rarlinux.tar.gz \
            https://www.rarlab.com/rar/rarlinux-x64-723.tar.gz
          tar -xzf /tmp/rarlinux.tar.gz -C /tmp
          cp /tmp/rar/unrar out/unrar
          chmod 0755 out/unrar
          out/unrar | head -n 5 || true
          sha256sum out/unrar > out/unrar.sha256
      - name: Upload unrar
        uses: actions/upload-artifact@v4
        with:
          name: unrar-linux-x64
          path: out
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
