name: Temporary Adobe source accessibility test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Test Adobe share download over HTTP/1.1
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          URL='https://www.adobe.com/files/id/urn:aaid:sc:AP:8b445864-1490-40a9-80b0-b2d5b262138c'
          curl --http1.1 -L -sS --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
            -D out/headers.txt -o out/source.bin -w '%{http_code}\n%{url_effective}\n%{content_type}\n%{size_download}\n' "$URL" \
            > out/curl-summary.txt 2> out/curl-stderr.txt
          ec=$?
          echo "$ec" > out/curl-exit.txt
          if [ -e out/source.bin ]; then
            stat -c '%s' out/source.bin > out/size.txt
            file out/source.bin > out/file.txt
            sha256sum out/source.bin > out/sha256.txt
            head -c 256 out/source.bin | xxd -p > out/head.hex
            strings -n 8 out/source.bin | head -n 80 > out/strings-head.txt || true
          fi
          cat out/curl-summary.txt || true
          cat out/file.txt || true
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: adobe-source-diagnostic-http1
          path: out
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
