name: Package Whisper Small Model

on:
  push:
    branches:
      - automation/whisper-model-pack-20260808
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified Whisper Small q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            -o ggml-small-q5_1.bin \
            https://github.com/AccessDevops/S2Tui/releases/download/models-v1/ggml-small.bin
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin" | sha256sum -c -
          test "$(stat -c%s ggml-small-q5_1.bin)" -eq 190085487

      - name: Upload model as ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5_1-model
          path: ggml-small-q5_1.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
