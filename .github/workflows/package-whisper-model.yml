name: Package Whisper Large v3 Turbo Model

on:
  push:
    branches:
      - automation/whisper-model-pack-20260808
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify Whisper large-v3-turbo q5_0
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            -o ggml-large-v3-turbo-q5_0.bin \
            https://github.com/AccessDevops/S2Tui/releases/download/models-v1/ggml-large-v3-turbo.bin
          echo "394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2  ggml-large-v3-turbo-q5_0.bin" | sha256sum -c -
          test "$(stat -c%s ggml-large-v3-turbo-q5_0.bin)" -eq 574041195
          split -b 300000000 -d -a 2 \
            ggml-large-v3-turbo-q5_0.bin \
            ggml-large-v3-turbo-q5_0.bin.part
          test "$(stat -c%s ggml-large-v3-turbo-q5_0.bin.part00)" -eq 300000000
          test "$(stat -c%s ggml-large-v3-turbo-q5_0.bin.part01)" -eq 274041195

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: whisper-large-v3-turbo-q5_0-part00
          path: ggml-large-v3-turbo-q5_0.bin.part00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: whisper-large-v3-turbo-q5_0-part01
          path: ggml-large-v3-turbo-q5_0.bin.part01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
